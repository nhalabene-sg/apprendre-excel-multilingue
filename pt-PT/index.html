  <style>
:root {
  --accent: #107c41;
  --accent-dark: #0b5d31;
  --accent-soft: #e9f6ef;
  --accent-rgb: 16, 124, 65;
  --ink: #17211b;
  --muted: #647067;
  --line: #dde5df;
  --paper: #ffffff;
  --canvas: #f3f7f4;
  --sidebar: #f8faf8;
  --danger: #b42318;
  --warning: #a15c00;
  --shadow: 0 18px 50px rgba(24, 48, 32, .10);
}

html[data-theme="word"] {
  --accent: #185abd;
  --accent-dark: #12478f;
  --accent-soft: #eaf2ff;
  --accent-rgb: 24, 90, 189;
  --ink: #172033;
  --muted: #626d81;
  --line: #dfe5ef;
  --canvas: #f4f7fc;
  --sidebar: #f8faff;
  --shadow: 0 18px 50px rgba(24, 55, 96, .10);
}

html[data-color-scheme="dark"] {
  color-scheme: dark;
  --accent: #35c77a;
  --accent-dark: #8aefb6;
  --accent-soft: #173b28;
  --accent-rgb: 53, 199, 122;
  --ink: #f2f8f4;
  --muted: #b8c8be;
  --line: #35483c;
  --paper: #17221b;
  --canvas: #0c1410;
  --sidebar: #111b15;
  --danger: #ff958d;
  --warning: #ffc56f;
  --shadow: 0 18px 50px rgba(0, 0, 0, .34);
}

html[data-theme="word"][data-color-scheme="dark"] {
  --accent: #69a8ff;
  --accent-dark: #b6d4ff;
  --accent-soft: #172f52;
  --accent-rgb: 105, 168, 255;
  --ink: #f4f7ff;
  --muted: #bdc8dc;
  --line: #354158;
  --paper: #171e2b;
  --canvas: #0c111b;
  --sidebar: #111725;
}

* { box-sizing: border-box; }
html { font-size: 16px; scroll-behavior: smooth; }
body {
  margin: 0;
  color: var(--ink);
  background: var(--canvas);
  font: 400 1rem/1.65 "Segoe UI", system-ui, -apple-system, sans-serif;
}
button, input { font: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
button:focus-visible, a:focus-visible, input:focus-visible, [tabindex]:focus-visible {
  outline: 3px solid rgba(var(--accent-rgb), .28);
  outline-offset: 3px;
}

.app-shell { min-height: 100vh; display: block; }
.sidebar {
  position: fixed; inset: 0 auto 0 0; z-index: 30;
  width: 310px; display: flex; flex-direction: column;
  border-right: 1px solid var(--line); background: var(--sidebar);
}
.brand { height: 84px; padding: 18px 22px; display: flex; align-items: center; gap: 13px; border-bottom: 1px solid var(--line); }
.brand-mark { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; color: #fff; background: var(--accent); font-size: 1.55rem; font-weight: 800; box-shadow: 0 10px 26px rgba(var(--accent-rgb), .24); }
.brand strong, .brand span { display: block; }
.brand strong { font-size: 1.02rem; }
.brand span { margin-top: 1px; color: var(--muted); font-size: .78rem; }
.progress-card { margin: 18px 18px 12px; padding: 15px; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); }
.progress-copy { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: .86rem; }
.progress-copy strong { color: var(--accent); font-size: .92rem; }
.progress-track { height: 8px; overflow: hidden; margin: 10px 0 8px; border-radius: 999px; background: var(--accent-soft); }
.progress-track span { display: block; width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--accent), #4cc681); transition: width .35s ease; }
html[data-theme="word"] .progress-track span { background: linear-gradient(90deg, var(--accent), #5aa3ff); }
.progress-card small { color: var(--muted); }
.search-box { margin: 0 18px 12px; display: flex; align-items: center; gap: 8px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--muted); }
.search-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(var(--accent-rgb), .10); }
.search-box input { min-width: 0; width: 100%; border: 0; outline: 0; background: transparent; color: var(--ink); }
.level-filter { flex: 0 0 auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin: 0 18px 10px; padding: 2px 0 6px; }
.level-chip { min-width: 0; display: inline-flex; align-items: center; justify-content: space-between; gap: 5px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper); color: var(--muted); cursor: pointer; font-size: .64rem; font-weight: 800; white-space: nowrap; }
.level-chip span { min-width: 18px; padding: 1px 5px; border-radius: 999px; background: #edf1ee; text-align: center; font-size: .62rem; }
.level-chip.active { border-color: var(--accent); background: var(--accent); color: #fff; }
.level-chip.active span { background: rgba(255,255,255,.2); color: #fff; }
.course-nav { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0 10px 20px; scrollbar-width: thin; }
.module-group { margin: 6px 0 10px; }
.module-title { padding: 8px 12px 6px; color: var(--muted); font-size: .72rem; font-weight: 800; letter-spacing: .075em; text-transform: uppercase; }
.lesson-link { width: 100%; display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 9px; padding: 9px 10px; border: 0; border-radius: 9px; background: transparent; color: var(--ink); cursor: pointer; text-align: left; font-size: .87rem; }
.lesson-link:hover { background: rgba(var(--accent-rgb), .07); }
.lesson-link.active { background: var(--accent-soft); color: var(--accent-dark); font-weight: 700; }
.lesson-num { width: 25px; height: 25px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 7px; background: var(--paper); color: var(--muted); font-size: .72rem; }
.lesson-link.active .lesson-num { border-color: var(--accent); background: var(--accent); color: #fff; }
.lesson-check { color: var(--accent); font-weight: 800; }
.sidebar-footer { margin-top: auto; padding: 14px 18px 18px; display: grid; gap: 9px; border-top: 1px solid var(--line); background: var(--sidebar); }
.sidebar-footer a { color: var(--accent); font-size: .82rem; font-weight: 700; text-decoration: none; }
.ghost-button { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--paper); color: var(--muted); cursor: pointer; font-size: .8rem; }
.ghost-button:hover { color: var(--danger); border-color: #f2bbb6; }

.main { min-width: 0; margin-left: 310px; }
.topbar { position: sticky; top: 0; z-index: 20; height: 70px; display: flex; align-items: center; justify-content: space-between; padding: 0 34px; border-bottom: 1px solid rgba(221,229,223,.9); background: rgba(255,255,255,.88); backdrop-filter: blur(18px); }
.crumb { color: var(--muted); font-size: .88rem; font-weight: 700; }
.top-actions { display: flex; align-items: center; gap: 10px; }
.global-navigation { display: flex; align-items: center; gap: 9px; margin-left: auto; margin-right: 14px; }
.portal-home { min-height: 38px; display: inline-flex; align-items: center; gap: 6px; padding: 6px 9px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--ink); text-decoration: none; font-size: .72rem; }
.portal-home span { color: var(--accent); font-size: 1rem; }
.course-switch { display: flex; padding: 3px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); }
.course-switch a, .course-switch strong { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 7px; color: var(--muted); text-decoration: none; font-size: .72rem; font-weight: 900; }
.course-switch strong { background: var(--accent); color: #fff; }
.language-switcher { display: grid; gap: 2px; color: var(--muted); font-size: .58rem; font-weight: 800; }
.language-switcher select { max-width: 168px; min-height: 30px; padding: 4px 26px 4px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); font: inherit; font-size: .68rem; font-weight: 800; }
.offline-pill { padding: 6px 10px; border-radius: 999px; color: var(--accent-dark); background: var(--accent-soft); font-size: .76rem; font-weight: 700; }
.icon-button { width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--ink); cursor: pointer; }
.menu-button { display: none; }

.lesson { max-width: 980px; min-height: calc(100vh - 160px); margin: 0 auto; padding: 48px 42px 60px; }
.eyebrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 16px; }
.tag { display: inline-flex; align-items: center; padding: 5px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-dark); font-size: .76rem; font-weight: 800; }
.tag.neutral { background: #edf1ee; color: var(--muted); }
.lesson h1 { max-width: 800px; margin: 0 0 16px; font-size: clamp(2rem, 4.4vw, 3.65rem); line-height: 1.06; letter-spacing: -.045em; }
.lead { max-width: 780px; margin: 0 0 30px; color: var(--muted); font-size: 1.12rem; line-height: 1.75; }
.mission-card { display: grid; grid-template-columns: 150px 1fr; gap: 22px; align-items: start; margin: 22px 0 30px; padding: 20px 22px; border: 1px solid rgba(var(--accent-rgb), .3); border-radius: 16px; background: linear-gradient(135deg, var(--accent-soft), #fff); }
.mission-card > span { color: var(--accent-dark); font-size: .7rem; font-weight: 900; letter-spacing: .08em; }
.mission-card h2 { margin: 0 0 5px; font-size: 1.15rem; line-height: 1.35; }
.mission-card p { margin: 0; color: var(--muted); font-size: .86rem; }
.learning-card { display: grid; grid-template-columns: 155px 1fr; gap: 24px; margin: 30px 0; padding: 22px; border: 1px solid var(--line); border-radius: 16px; background: var(--paper); box-shadow: 0 12px 32px rgba(20,40,26,.05); }
.learning-card h2, .section-title { margin: 0; font-size: 1.05rem; }
.learning-card ul { margin: 0; padding-left: 20px; }
.learning-card li + li { margin-top: 7px; }
.section { margin-top: 38px; }
.section-title { margin-bottom: 16px; font-size: 1.3rem; }
.steps { display: grid; gap: 12px; }
.step { display: grid; grid-template-columns: 38px 1fr; gap: 13px; align-items: start; padding: 16px; border: 1px solid var(--line); border-radius: 13px; background: rgba(255,255,255,.72); }
.step-number { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; background: var(--accent); color: #fff; font-size: .86rem; font-weight: 800; }
.step p { margin: 2px 0 0; }
.step-content { min-width: 0; }
.step-main { font-weight: 650; line-height: 1.55; }
.step-guidance { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.step-guidance span { min-width: 0; padding: 10px 11px; border: 1px solid var(--line); border-radius: 9px; background: var(--canvas); color: var(--muted); font-size: .76rem; line-height: 1.42; }
.step-guidance b { display: block; margin-bottom: 4px; color: var(--accent-dark); font-size: .67rem; font-weight: 900; letter-spacing: .045em; text-transform: uppercase; }
.tip { margin-top: 16px; padding: 16px 18px; border-left: 4px solid var(--accent); border-radius: 0 12px 12px 0; background: var(--accent-soft); }
.tip strong { color: var(--accent-dark); }
kbd, code { border-radius: 6px; font-family: Consolas, monospace; font-size: .9em; }
kbd { padding: 3px 7px; border: 1px solid #cfd7d1; border-bottom-width: 2px; background: #fff; }
code { padding: 2px 6px; background: rgba(var(--accent-rgb), .09); color: var(--accent-dark); }

.real-shot { margin: 34px 0 8px; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--paper); box-shadow: var(--shadow); }
.shot-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 15px; border-bottom: 1px solid var(--line); background: #f8faf8; }
.shot-header strong { font-size: .88rem; }
.shot-header span { color: var(--muted); font-size: .72rem; }
.real-shot button { width: 100%; display: block; padding: 24px; border: 0; background: #fff; cursor: zoom-in; }
.real-shot img { display: block; max-width: 100%; max-height: 510px; margin: 0 auto; object-fit: contain; }
.real-shot figcaption { padding: 12px 16px 15px; border-top: 1px solid var(--line); color: var(--muted); font-size: .78rem; }
.real-shot figcaption a { color: var(--accent); }

.office-preview { position: relative; margin: 14px 0 0; overflow: hidden; border: 1px solid #bcc8bf; border-radius: 14px; background: #fff; box-shadow: var(--shadow); }
.guided-block { margin-top: 34px; }
.guide-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 10px; }
.guide-heading strong, .guide-heading span { display: block; }
.guide-heading strong { font-size: 1.05rem; }
.guide-heading div > span { color: var(--muted); font-size: .82rem; }
.live-badge { flex: 0 0 auto; padding: 5px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-dark); font-size: .67rem; font-weight: 900; letter-spacing: .06em; }
.demo-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 13px 14px; border: 1px solid var(--line); border-radius: 13px; background: var(--paper); }
.locale-card { min-width: 0; display: grid; grid-template-columns: auto 1fr; column-gap: 10px; align-items: center; }
.locale-card > span { grid-row: 1 / 3; width: 34px; height: 34px; display: grid; place-items: center; overflow: hidden; border-radius: 10px; background: var(--accent-soft); color: transparent; font-size: 0; }
.locale-card > span::before { content: "Aa"; color: var(--accent-dark); font-size: .78rem; font-weight: 900; }
.locale-card strong { color: var(--ink); font-size: .83rem; }
.locale-card small { color: var(--muted); font-size: .69rem; line-height: 1.35; }
.demo-buttons { flex: 0 0 auto; display: flex; gap: 7px; }
.demo-buttons button { padding: 8px 10px; border: 1px solid rgba(var(--accent-rgb), .32); border-radius: 9px; background: var(--accent); color: #fff; cursor: pointer; font-size: .73rem; font-weight: 850; }
.demo-buttons button + button { background: var(--paper); color: var(--accent-dark); }
.demo-buttons button:disabled { cursor: not-allowed; opacity: .45; }
.demo-control-group { flex: 0 0 auto; display: grid; grid-template-columns: auto auto; align-items: center; gap: 5px 8px; }
.demo-control-group > label { color: var(--muted); font-size: .66rem; font-weight: 850; }
.demo-control-group > select { min-height: 32px; padding: 5px 27px 5px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); font: inherit; font-size: .7rem; font-weight: 800; }
.demo-control-group .demo-buttons { grid-column: 1 / -1; }
.keyboard-coach { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 10px; padding: 12px 14px; border: 1px solid rgba(var(--accent-rgb), .25); border-radius: 13px; background: linear-gradient(135deg, var(--accent-soft), var(--paper)); }
.keyboard-heading { min-width: 0; display: flex; align-items: center; gap: 10px; }
.keyboard-heading > span { width: 36px; height: 36px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 10px; background: var(--paper); font-size: 1.05rem; }
.keyboard-heading p { margin: 0; }
.keyboard-heading strong, .keyboard-heading small { display: block; }
.keyboard-heading strong { color: var(--accent-dark); font-size: .8rem; }
.keyboard-heading small { margin-top: 3px; color: var(--muted); font-size: .67rem; line-height: 1.35; }
.keyboard-combos { flex: 0 1 auto; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 7px; }
.keyboard-combo { display: inline-flex; align-items: center; gap: 4px; padding: 6px; border: 1px solid var(--line); border-radius: 9px; background: var(--paper); }
.keyboard-combo kbd { min-width: 30px; padding: 5px 7px; border: 1px solid #aeb9b1; border-bottom-width: 3px; background: #fff; color: #17211b; text-align: center; font-size: .68rem; font-weight: 900; }
.keyboard-combo i { color: var(--muted); font-size: .66rem; font-style: normal; font-weight: 900; }
.preview-titlebar { padding: 10px 14px; color: #fff; background: var(--accent); font-size: .82rem; }
.preview-ribbon { display: flex; gap: 6px; padding: 7px 9px; overflow-x: auto; border-bottom: 1px solid #d4d9d5; background: #fafafa; color: #364239; font-size: .72rem; }
.preview-ribbon strong { color: var(--accent); }
.preview-ribbon span { flex: 0 0 auto; padding: 5px 8px; border: 2px solid transparent; border-radius: 7px; }
.preview-ribbon .default-tab { color: var(--accent); font-weight: 800; }
.preview-ribbon .tab-active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-dark); font-weight: 900; animation: guidePulse 1.25s ease-in-out infinite; }
.guided-actions { display: flex; gap: 10px; padding: 13px 14px; overflow-x: auto; border-bottom: 1px solid #d4d9d5; background: #fff; }
.guided-actions .guide-target { position: relative; flex: 1 0 150px; min-height: 48px; display: flex; align-items: center; gap: 9px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 9px; background: #fff; color: var(--ink); cursor: pointer; font-size: .78rem; font-weight: 700; text-align: left; }
.guided-actions .guide-target > span { width: 25px; height: 25px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 7px; background: var(--accent-soft); color: var(--accent-dark); font-size: .72rem; font-weight: 900; }
.guide-target.guide-active { z-index: 2; color: var(--accent-dark); font-weight: 900; }
.guide-target.guide-active::before { content: ""; position: absolute; inset: -3px; border: 3px solid var(--accent); border-radius: 11px; box-shadow: 0 0 0 5px rgba(var(--accent-rgb), .13); animation: guidePulse 1.25s ease-in-out infinite; }
.guide-target.guide-active::after { content: attr(data-click-label); position: absolute; z-index: 5; right: 6px; top: -13px; min-width: 76px; padding: 4px 7px; border-radius: 7px; background: var(--accent); color: #fff; font-size: .66rem; font-weight: 800; text-align: center; white-space: nowrap; box-shadow: 0 8px 24px rgba(var(--accent-rgb), .28); }
@keyframes guidePulse { 50% { box-shadow: 0 0 0 10px rgba(var(--accent-rgb), .05); } }
.demo-cursor { --cursor-x: 92px; --cursor-y: 105px; position: absolute; z-index: 9; left: 0; top: 0; display: flex; align-items: center; gap: 3px; pointer-events: none; transform: translate(var(--cursor-x), var(--cursor-y)); transition: transform .55s cubic-bezier(.2,.8,.2,1); filter: drop-shadow(0 4px 4px rgba(0,0,0,.22)); }
.demo-cursor i { display: block; color: #111; font-size: 1.75rem; font-style: normal; line-height: 1; text-shadow: -1px -1px 0 #fff, 1px 1px 0 #fff; animation: cursorTap 1.35s ease-in-out infinite; }
.demo-cursor b { display: none; }
@keyframes cursorTap { 45%, 60% { transform: translate(-3px, -3px) scale(.88); } }
.result-stamp { position: absolute; z-index: 8; right: 18px; bottom: 18px; padding: 8px 11px; border-radius: 9px; background: #0b6836; color: #fff; font-size: .72rem; font-weight: 900; opacity: 0; transform: translateY(8px) scale(.92); box-shadow: 0 10px 28px rgba(11,104,54,.28); }
.guided-block:not(.is-playing) .demo-cursor i { animation-play-state: paused; }
.guided-block.is-playing .keyboard-combo kbd { animation: keyPress var(--demo-duration, 5.6s) ease-in-out infinite; animation-delay: calc(var(--key-order) * .12s); }
.guided-block.is-playing .result-stamp { animation: resultStamp var(--demo-duration, 5.6s) ease-in-out infinite; }
.guided-block.is-playing .cell.selected,
.guided-block.is-playing .word-page { animation: workspaceResult var(--demo-duration, 5.6s) ease-in-out infinite; }
@keyframes keyPress { 18%, 35% { transform: translateY(2px); border-bottom-width: 1px; background: var(--accent-soft); } }
@keyframes resultStamp { 0%, 60% { opacity: 0; transform: translateY(8px) scale(.92); } 72%, 92% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; } }
@keyframes workspaceResult { 0%, 64%, 100% { filter: none; } 76%, 92% { filter: saturate(1.2) drop-shadow(0 0 9px rgba(var(--accent-rgb), .22)); } }
.office-preview[data-demo-zone="ribbon"] .preview-ribbon,
.office-preview[data-demo-zone="workspace"] .scene,
.office-preview[data-demo-zone="workspace"] .word-page-wrap,
.office-preview[data-demo-zone="result"] .scene,
.office-preview[data-demo-zone="result"] .word-page-wrap { box-shadow: inset 0 0 0 3px rgba(var(--accent-rgb), .33); }
.guide-progress { display: flex; justify-content: center; gap: 7px; margin: 13px 0 9px; }
.guide-dot { width: 10px; height: 10px; padding: 0; border: 0; border-radius: 999px; background: var(--line); cursor: pointer; transition: width .2s ease, background .2s ease; }
.guide-dot.active { width: 32px; background: var(--accent); }
.guide-dot.guide-complete:not(.active) { background: #0b6836; }
.guide-target.guide-complete > span { background: #0b6836; color: #fff; }
.animation-flow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.animation-flow span { display: flex; align-items: center; justify-content: center; gap: 7px; padding: 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--muted); font-size: .71rem; font-weight: 850; }
.animation-flow i { width: 21px; height: 21px; display: grid; place-items: center; border-radius: 7px; background: var(--accent-soft); color: var(--accent-dark); font-size: .65rem; font-style: normal; }
.guided-block.is-playing .animation-flow span { animation: flowStep var(--demo-duration, 5.6s) ease-in-out infinite; }
.guided-block.is-playing .animation-flow span:nth-child(2) { animation-delay: var(--demo-phase-two, 1.7s); }
.guided-block.is-playing .animation-flow span:nth-child(3) { animation-delay: var(--demo-phase-three, 3.4s); }
@keyframes flowStep { 0%, 22% { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-dark); transform: translateY(-2px); } 32%, 100% { border-color: var(--line); background: var(--paper); color: var(--muted); transform: none; } }
.instruction-panel { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; }
.instruction-panel > div { min-width: 0; display: grid; grid-template-columns: 30px 1fr; gap: 9px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); }
.instruction-panel > div > span { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 9px; background: var(--accent-soft); color: var(--accent-dark); font-size: .72rem; font-weight: 900; }
.instruction-panel p { min-width: 0; margin: 0; }
.instruction-panel b, .instruction-panel strong { display: block; }
.instruction-panel b { margin-bottom: 5px; color: var(--muted); font-size: .63rem; font-weight: 900; letter-spacing: .055em; text-transform: uppercase; }
.instruction-panel strong { color: var(--ink); font-size: .78rem; line-height: 1.4; }
.reproduce-bar { display: flex; align-items: center; gap: 10px; margin-top: 9px; padding: 11px 13px; border: 1px dashed rgba(var(--accent-rgb), .45); border-radius: 11px; background: color-mix(in srgb, var(--accent-soft) 70%, var(--paper)); }
.reproduce-bar > span { width: 31px; height: 31px; display: grid; place-items: center; border-radius: 9px; background: var(--paper); }
.reproduce-bar p { flex: 1; margin: 0; }
.reproduce-bar strong, .reproduce-bar small { display: block; }
.reproduce-bar strong { color: var(--accent-dark); font-size: .77rem; }
.reproduce-bar small { margin-top: 2px; color: var(--muted); font-size: .69rem; line-height: 1.4; }
.reproduce-bar button { flex: 0 0 auto; padding: 8px 10px; border: 1px solid rgba(var(--accent-rgb), .35); border-radius: 9px; background: var(--paper); color: var(--accent-dark); cursor: pointer; font-size: .7rem; font-weight: 850; }
.reproduce-bar button.done { border-color: #0b6836; background: #0b6836; color: #fff; }
.click-coach { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; margin-top: 10px; padding: 13px 14px; border: 1px solid rgba(var(--accent-rgb), .24); border-radius: 12px; background: var(--accent-soft); }
.coach-count { width: 42px; height: 30px; display: grid; place-items: center; border-radius: 8px; background: var(--accent); color: #fff; font-size: .72rem; font-weight: 900; }
.click-coach p { margin: 0; color: var(--accent-dark); font-size: .82rem; }
.click-coach p strong, .click-coach p span { display: block; }
.click-coach p strong { margin-bottom: 2px; font-size: .66rem; letter-spacing: .04em; text-transform: uppercase; }
.click-coach button { padding: 8px 10px; border: 1px solid rgba(var(--accent-rgb), .3); border-radius: 8px; background: #fff; color: var(--accent-dark); cursor: pointer; font-size: .76rem; font-weight: 800; }
.sheet-shell { position: relative; background: #fff; }
.sheet-viewport { max-height: 282px; overflow: auto; scrollbar-color: #a8b9ad #eef3ef; }
.sheet { display: grid; grid-template-columns: 38px repeat(6, minmax(88px, 1fr)); min-width: 620px; }
.cell-readout { position: absolute; z-index: 7; right: 13px; top: 9px; display: flex; align-items: center; gap: 7px; padding: 6px 9px; border: 1px solid rgba(var(--accent-rgb), .32); border-radius: 8px; background: rgba(255,255,255,.94); color: #415247; box-shadow: 0 5px 18px rgba(0,0,0,.1); font-size: .64rem; font-weight: 800; }
.cell-readout strong { min-width: 28px; color: var(--accent); font-size: .78rem; text-align: center; }
.scene { min-height: 205px; background: #fff; }
.formula-bar { display: grid; grid-template-columns: 42px 1fr; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid #dbe2dd; background: #f7f8f7; font: .76rem Consolas, monospace; }
.formula-bar b { color: var(--accent); font-style: italic; }
.chart-scene { padding: 24px; background: linear-gradient(180deg, #fff, #f5f8f6); }
.kpi-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
.kpi-row span { padding: 10px; border: 1px solid var(--line); border-radius: 9px; color: var(--muted); font-size: .7rem; }
.kpi-row b { display: block; color: var(--ink); font-size: 1.1rem; }
.mini-chart { height: 110px; display: flex; align-items: end; gap: 14px; padding: 8px 16px 0; border-left: 1px solid #cdd6cf; border-bottom: 1px solid #cdd6cf; }
.mini-chart i { flex: 1; max-width: 70px; border-radius: 6px 6px 0 0; background: linear-gradient(180deg, #4fc17b, var(--accent)); }
.pivot-scene { display: grid; grid-template-columns: 1fr 180px; gap: 20px; padding: 22px; background: #f7f9f7; }
.pivot-grid { display: grid; grid-template-columns: 1fr auto; border: 1px solid var(--line); background: #fff; }
.pivot-grid > * { padding: 8px 10px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); font-size: .78rem; }
.pivot-grid b { background: var(--accent-soft); color: var(--accent-dark); }
.field-list, .query-steps { display: grid; align-content: start; gap: 7px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; font-size: .72rem; }
.field-list span, .query-steps span { padding: 5px 7px; border-radius: 5px; background: #f1f4f2; }
.data-scene { display: grid; grid-template-columns: 170px 1fr; }
.data-scene .query-steps { border-width: 0 1px 0 0; border-radius: 0; }
.query-steps .active { background: var(--accent-soft); color: var(--accent-dark); font-weight: 800; }
.cell { min-height: 39px; display: flex; align-items: center; padding: 6px 9px; border-right: 1px solid #dbe2dd; border-bottom: 1px solid #dbe2dd; font-size: .77rem; white-space: nowrap; }
.cell.head, .cell.rowhead { justify-content: center; background: #f2f4f2; color: #5c665f; font-weight: 700; }
.cell.selected { position: relative; outline: 2px solid var(--accent); outline-offset: -2px; background: var(--accent-soft); }
.word-page-wrap { padding: 28px; background: #e7eaed; }
.word-page { max-width: 570px; min-height: 330px; margin: auto; padding: 46px 52px; box-shadow: 0 3px 14px rgba(0,0,0,.16); background: #fff; }
.word-page h3 { margin: 0 0 18px; color: #233; font-family: Georgia, serif; font-size: 1.6rem; }
.word-page p { color: #343a40; font-family: Georgia, serif; }
.word-page h4 { margin: 12px 0 9px; color: #29384b; }
.toc-page p { display: flex; justify-content: space-between; border-bottom: 1px dotted #8d99a8; font-size: .85rem; }
.toc-page small { color: #66758a; }
.doc-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.image-placeholder { height: 105px; display: grid; place-items: center; border: 1px dashed #7792b5; border-radius: 5px; background: #e8f1fc; color: #40658f; font-size: .78rem; }
.visual-page small { display: block; margin-top: 6px; color: #66758a; font-size: .66rem; }
.doc-table { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid #b8c6d7; font-size: .72rem; }
.doc-table > * { padding: 5px; border: 1px solid #d6dfe9; }
.review-page { position: relative; padding-right: 155px; }
.review-page mark { background: #d9ebff; border-bottom: 2px solid #2674c9; }
.comment-bubble { position: absolute; top: 105px; right: 18px; width: 125px; padding: 9px; border-left: 3px solid #d39b00; background: #fff5c9; color: #4f4531; font-size: .65rem; }
.comment-bubble span, .comment-bubble b { display: block; }
.layout-page { position: relative; padding-top: 60px; padding-bottom: 60px; }
.layout-page header, .layout-page footer { position: absolute; left: 52px; right: 52px; color: #63758c; font: .64rem "Segoe UI", sans-serif; }
.layout-page header { top: 24px; padding-bottom: 6px; border-bottom: 1px solid #cdd6e1; }
.layout-page footer { bottom: 24px; text-align: right; }
.form-page label { display: grid; gap: 4px; margin: 10px 0; color: #334155; font: .72rem "Segoe UI", sans-serif; font-weight: 700; }
.form-page label span { padding: 7px 9px; border: 1px solid #b6c3d3; background: #f8fafc; color: #64748b; font-weight: 400; }

.practice-card, .quiz-card { margin-top: 34px; padding: 24px; border: 1px solid var(--line); border-radius: 16px; background: var(--paper); box-shadow: 0 14px 38px rgba(25,42,31,.06); }
.practice-card { position: relative; overflow: hidden; }
.practice-card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 5px; background: var(--accent); }
.practice-card h2, .quiz-card h2 { margin: 0 0 8px; font-size: 1.25rem; }
.practice-heading { display: flex; align-items: start; justify-content: space-between; gap: 16px; }
.practice-heading p { margin-bottom: 0; }
.practice-heading > strong { flex: 0 0 auto; padding: 5px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-dark); font-size: .72rem; }
.practice-card p, .quiz-card > p { margin: 0 0 16px; color: var(--muted); }
.exercise-program { display: grid; gap: 16px; margin-top: 22px; }
.exercise-group { padding: 18px; border: 1px solid var(--line); border-radius: 14px; background: #fbfcfb; }
.exercise-group.independent { background: color-mix(in srgb, var(--accent-soft) 35%, white); }
.exercise-group.challenge { border-style: dashed; background: #fffaf0; }
.exercise-group.project { border-color: rgba(var(--accent-rgb), .38); background: linear-gradient(135deg, #fff, var(--accent-soft)); }
.exercise-label { display: inline-flex; margin-bottom: 8px; padding: 5px 9px; border-radius: 999px; background: var(--ink); color: #fff; font-size: .74rem; font-weight: 900; letter-spacing: .02em; }
.exercise-group.independent .exercise-label { background: var(--accent); }
.exercise-group.challenge .exercise-label { background: #a85d00; }
.exercise-group.project .exercise-label { background: var(--accent-dark); }
.exercise-group > p { margin: 0; color: var(--muted); }
.task-list { display: grid; gap: 10px; margin-top: 16px; }
.task-list label { display: flex; align-items: flex-start; gap: 10px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
.task-list input { margin-top: 5px; accent-color: var(--accent); }
.task-list label:has(input:checked) { border-color: rgba(var(--accent-rgb), .35); background: var(--accent-soft); }
.quiz-options { display: grid; gap: 10px; margin: 18px 0; }
.quiz-option { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: center; padding: 13px 14px; border: 1px solid var(--line); border-radius: 11px; cursor: pointer; }
.quiz-option:hover { border-color: rgba(var(--accent-rgb), .45); }
.quiz-option:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.quiz-option input { accent-color: var(--accent); }
.quiz-result { display: none; margin-top: 14px; padding: 13px 15px; border-radius: 10px; }
.quiz-result.show { display: block; }
.quiz-result.correct { background: #e8f7ef; color: #126337; }
.quiz-result.wrong { background: #fff1f0; color: #9b2017; }
.action-button { min-height: 44px; padding: 10px 16px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer; font-weight: 800; }
.action-button:hover { background: var(--accent-dark); }
.action-button:disabled { cursor: not-allowed; opacity: .45; }
.completion-banner { display: none; align-items: center; gap: 12px; margin-top: 18px; padding: 14px 16px; border: 1px solid rgba(var(--accent-rgb), .25); border-radius: 12px; background: var(--accent-soft); color: var(--accent-dark); font-weight: 700; }
.completion-banner.show { display: flex; }
.course-finish { margin-top: 24px; padding: 22px; display: grid; grid-template-columns: 54px 1fr; gap: 16px; align-items: start; border: 1px solid var(--line); border-radius: 16px; background: #fff; box-shadow: 0 14px 38px rgba(25,42,31,.06); }
.course-finish.complete { border-color: rgba(var(--accent-rgb), .35); background: linear-gradient(135deg, #fff, var(--accent-soft)); }
.finish-icon { width: 50px; height: 50px; display: grid; place-items: center; border-radius: 14px; background: var(--accent-soft); color: var(--accent-dark); font-size: 1.35rem; font-weight: 900; }
.course-finish.complete .finish-icon { background: var(--accent); color: #fff; }
.course-finish h2 { margin: 0 0 4px; font-size: 1.35rem; }
.course-finish p { margin: 0 0 14px; color: var(--muted); }

.lesson-footer { max-width: 980px; margin: 0 auto; padding: 0 42px 42px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 14px; }
.lesson-position { color: var(--muted); font-size: .84rem; text-align: center; }
.nav-button { min-height: 46px; padding: 10px 18px; border-radius: 11px; cursor: pointer; font-weight: 800; }
.nav-button.secondary { justify-self: start; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
.nav-button.primary { justify-self: end; border: 1px solid var(--accent); background: var(--accent); color: #fff; }
.nav-button:disabled { cursor: not-allowed; opacity: .38; }
.toast { position: fixed; right: 22px; bottom: 22px; z-index: 60; max-width: 340px; padding: 12px 16px; border-radius: 11px; background: #17211b; color: #fff; box-shadow: 0 12px 40px rgba(0,0,0,.22); opacity: 0; transform: translateY(14px); pointer-events: none; transition: .25s ease; }
.toast.show { opacity: 1; transform: translateY(0); }
.scrim { display: none; position: fixed; inset: 0; z-index: 25; background: rgba(13,22,16,.48); }
.image-dialog { width: min(960px, calc(100vw - 28px)); max-height: calc(100vh - 28px); padding: 18px; border: 0; border-radius: 16px; box-shadow: 0 30px 90px rgba(0,0,0,.3); }
.image-dialog::backdrop { background: rgba(0,0,0,.72); backdrop-filter: blur(4px); }
.image-dialog img { display: block; max-width: 100%; max-height: calc(100vh - 120px); margin: auto; object-fit: contain; }
.image-dialog p { margin: 12px 36px 0 4px; color: var(--muted); font-size: .86rem; }
.dialog-close { position: absolute; top: 9px; right: 9px; width: 36px; height: 36px; border: 0; border-radius: 50%; background: #18201b; color: #fff; cursor: pointer; font-size: 1.4rem; }

html[data-color-scheme="dark"] .topbar { border-bottom-color: var(--line); background: color-mix(in srgb, var(--canvas) 88%, transparent); }

html[data-color-scheme="dark"] .tag.neutral { background: #27342c; color: #d3dfd7; }

html[data-color-scheme="dark"] .step { background: var(--paper); }

html[data-color-scheme="dark"] kbd { border-color: #526158; background: #253129; color: #fff; }
html[data-color-scheme="dark"] .shot-header { background: #202c24; }
html[data-color-scheme="dark"] .exercise-group { background: #1c2820; }
html[data-color-scheme="dark"] .exercise-group.independent { background: color-mix(in srgb, var(--accent-soft) 65%, var(--paper)); }
html[data-color-scheme="dark"] .exercise-group.challenge { background: #302719; }
html[data-color-scheme="dark"] .exercise-group.project,
html[data-color-scheme="dark"] .course-finish { background: linear-gradient(135deg, var(--paper), var(--accent-soft)); }
html[data-color-scheme="dark"] .exercise-label { color: #fff; }
html[data-color-scheme="dark"] .action-button:hover { background: var(--accent); filter: brightness(1.12); }

html[data-color-scheme="dark"] .demo-toolbar,
html[data-color-scheme="dark"] .instruction-panel > div { border-color: var(--line); background: var(--paper); }
html[data-color-scheme="dark"] .demo-buttons button + button { background: #172119; color: #dff7e7; }
html[data-color-scheme="dark"] .demo-control-group > select,
html[data-color-scheme="dark"] .reproduce-bar button { background: #172119; color: #dff7e7; }
html[data-color-scheme="dark"] .reproduce-bar button.done { background: #35a862; color: #07150c; }
html[data-color-scheme="dark"] .keyboard-heading > span,
html[data-color-scheme="dark"] .keyboard-combo,
html[data-color-scheme="dark"] .reproduce-bar > span { background: #172119; }
html[data-color-scheme="dark"] .office-preview .guided-actions .guide-target,
html[data-color-scheme="dark"] .office-preview .kpi-row b { color: #17211b; }
html[data-theme="word"][data-color-scheme="dark"] .office-preview .guided-actions .guide-target,
html[data-theme="word"][data-color-scheme="dark"] .office-preview .kpi-row b { color: #172033; }
html[data-color-scheme="dark"] .completion-banner { color: var(--accent-dark); }
html[data-color-scheme="dark"] .toast { border: 1px solid #435349; background: #050907; color: #fff; }

body.focus-mode .sidebar { transform: translateX(-100%); }
body.focus-mode .main { margin-left: 0; }

@media (max-width: 920px) {
  .app-shell { display: block; }
  .sidebar { transform: translateX(-102%); transition: transform .25s ease; box-shadow: 12px 0 40px rgba(0,0,0,.18); }
  body.menu-open .sidebar { transform: translateX(0); }
  body.menu-open .scrim { display: block; }
  .main { margin-left: 0; }
  .menu-button { display: grid; }
  .topbar { padding: 0 18px; }
  .crumb { display: none; }
  .global-navigation { margin-left: 0; }
  .menu-button, .top-actions .icon-button { width: 44px; height: 44px; }
  .portal-home, .language-switcher select { min-height: 44px; }
  .lesson { padding: 34px 22px 48px; }
  .lesson-footer { padding: 0 22px 30px; }
}

@media (max-width: 620px) {
  .sidebar { width: min(320px, calc(100vw - 48px)); }
  .offline-pill { display: none; }
  .topbar {
    min-height: 112px; height: auto; display: grid;
    grid-template-columns: 44px 1fr auto;
    grid-template-areas: "menu spacer actions" "navigation navigation navigation";
    gap: 8px 10px; padding: 8px max(10px, env(safe-area-inset-right)) 9px max(10px, env(safe-area-inset-left));
  }
  .menu-button { grid-area: menu; width: 44px; height: 44px; }
  .top-actions { grid-area: actions; gap: 8px; }
  .global-navigation {
    grid-area: navigation; width: 100%; display: grid;
    grid-template-columns: 44px 72px minmax(0, 1fr);
    align-items: center; gap: 7px; margin: 0;
  }
  .portal-home { min-width: 44px; min-height: 44px; justify-content: center; padding: 5px; }
  .portal-home b, .language-switcher > span { display: none; }
  .course-switch { min-height: 44px; justify-content: center; }
  .course-switch a, .course-switch strong { width: 32px; height: 36px; }
  .language-switcher { min-width: 0; width: 100%; }
  .language-switcher select { width: 100%; max-width: none; min-width: 0; min-height: 44px; font-size: .75rem; }
  .top-actions .icon-button { width: 44px; height: 44px; }
  .lesson { padding: 30px 18px 44px; }
  .lesson h1 { font-size: clamp(2rem, 10vw, 2.45rem); }
  .lead { font-size: 1rem; }
  .learning-card { grid-template-columns: 1fr; gap: 10px; padding: 18px; }
  .mission-card { grid-template-columns: 1fr; gap: 7px; padding: 18px; }
  .practice-card, .quiz-card { padding: 19px; }
  .lesson-footer { grid-template-columns: 1fr 1fr; }
  .lesson-position { grid-column: 1 / -1; grid-row: 1; }
  .nav-button.secondary { grid-column: 1; grid-row: 2; }
  .nav-button.primary { grid-column: 2; grid-row: 2; }
  .word-page-wrap { padding: 14px; }
  .word-page { padding: 30px 24px; }
  .layout-page header, .layout-page footer { left: 24px; right: 24px; }
  .doc-columns { grid-template-columns: 1fr; }
  .review-page { padding-right: 24px; padding-bottom: 118px; }
  .comment-bubble { top: auto; right: 24px; bottom: 24px; width: calc(100% - 48px); }
  .pivot-scene, .data-scene { grid-template-columns: 1fr; }
  .data-scene .query-steps { border-width: 0 0 1px; }
  .kpi-row { grid-template-columns: 1fr; }
  .practice-heading { display: grid; }
  .guide-heading { align-items: flex-start; }
  .demo-toolbar { align-items: stretch; flex-direction: column; }
  .demo-control-group { grid-template-columns: 1fr auto; }
  .keyboard-coach { align-items: stretch; flex-direction: column; }
  .keyboard-combos { justify-content: flex-start; }
  .demo-buttons button { flex: 1; }
  .step-guidance, .instruction-panel, .animation-flow { grid-template-columns: 1fr; }
  .click-coach { grid-template-columns: auto 1fr; }
  .click-coach button { grid-column: 1 / -1; }
  .reproduce-bar { align-items: flex-start; flex-wrap: wrap; }
  .reproduce-bar p { min-width: calc(100% - 48px); }
  .reproduce-bar button { width: 100%; }
  .lesson-link, .nav-button, .demo-buttons button, .guide-target, .reproduce-bar button { min-height: 44px; }
  .lesson-footer { padding: 0 18px max(26px, env(safe-area-inset-bottom)); gap: 9px; }
}

@media (max-width: 380px) {
  .topbar { grid-template-columns: 44px 1fr auto; padding-left: 8px; padding-right: 8px; }
  .global-navigation { grid-template-columns: 44px 70px minmax(0, 1fr); gap: 5px; }
  .top-actions { gap: 5px; }
  .top-actions .icon-button { width: 42px; height: 42px; }

  <script>
(() => {
  const course = window.COURSE;
  const t = window.COURSE_UI;
  if (!course) throw new Error('Dados do curso em falta.');
  if (!t) throw new Error('Textos da interface em falta.');

  const levelRanges = [
    { key: 'start', end: 4 },
    { key: 'beginner', end: 10 },
    { key: 'basic', end: 18 },
    { key: 'intermediate', end: 27 },
    { key: 'advanced', end: 42 },
    { key: 'professional', end: 57 },
    { key: 'projects', end: 60 }
  ];

  function levelKeyForIndex(index) {
    return levelRanges.find(range => index + 1 <= range.end)?.key || 'projects';
  }

  const flatLessons = [];
  course.modules.forEach((module, moduleIndex) => {
    module.lessons.forEach((lesson, lessonIndex) => {
      flatLessons.push({ ...lesson, module, moduleIndex, lessonIndex, levelKey: levelKeyForIndex(flatLessons.length) });
    });
  });

  const storageKey = `aprender-office-${course.slug}-${t.locale}-v3`;
  const memoryStorage = {};
  const storage = {
    get(key) {
      try { return window.localStorage.getItem(key); }
      catch { return memoryStorage[key] || null; }
    },
    set(key, value) {
      try { window.localStorage.setItem(key, value); }
      catch { memoryStorage[key] = value; }
    }
  };
  let saved = {};
  try { saved = JSON.parse(storage.get(storageKey) || '{}'); }
  catch { saved = {}; }
  let current = Math.min(Number(saved.current) || 0, flatLessons.length - 1);
  let completed = new Set(Array.isArray(saved.completed) ? saved.completed : []);
  let practiceState = saved.practice && typeof saved.practice === 'object' ? saved.practice : {};
  let guideState = saved.guide && typeof saved.guide === 'object' ? saved.guide : {};
  let selectedLevel = 'all';
  let toastTimer;
  let coachTimer;

  const $ = (selector) => document.querySelector(selector);
  const nav = $('#courseNav');
  const lessonRoot = $('#lesson');
  const progressBar = $('#progressBar');
  const progressText = $('#progressText');
  const progressCount = $('#progressCount');
  const prevButton = $('#prevButton');
  const nextButton = $('#nextButton');
  const search = $('#lessonSearch');
  const levelFilter = $('#levelFilter');

  function escapeHTML(value = '') {
    return String(value).replace(/[&<>'"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#039;', '"': '&quot;' }[char]));
  }

  function format(template, values = {}) {
    return String(template).replace(/\{(\w+)\}/g, (_, key) => values[key] ?? '');
  }

  function save() {
    storage.set(storageKey, JSON.stringify({ current, completed: [...completed], practice: practiceState, guide: guideState }));
  }

  function lessonId(index) {
    return flatLessons[index].id || `${course.slug}-${index + 1}`;
  }

  function updateProgress() {
    const percent = Math.round((completed.size / flatLessons.length) * 100);
    progressBar.style.width = `${percent}%`;
    progressText.textContent = `${percent}%`;
    progressCount.textContent = format(t.progressCount, { done: completed.size, total: flatLessons.length });
  }

  function levelLabel(item) {
    return t.levels.find(level => level.key === item.levelKey)?.label || item.level;
  }

  function renderLevelFilter() {
    if (!levelFilter) return;
    const levels = [{ key: 'all', label: t.allLevels }, ...t.levels];
    levelFilter.innerHTML = levels.map(level => {
      const count = level.key === 'all' ? flatLessons.length : flatLessons.filter(item => item.levelKey === level.key).length;
      return `<button type="button" class="level-chip${selectedLevel === level.key ? ' active' : ''}" data-level="${level.key}">${escapeHTML(level.label)}<span>${count}</span></button>`;
    }).join('');
    levelFilter.querySelectorAll('[data-level]').forEach(button => button.addEventListener('click', () => {
      selectedLevel = button.dataset.level;
      renderLevelFilter();
      renderNav(search.value);
    }));
  }

  function renderNav(filter = '') {
    const term = filter.trim().toLocaleLowerCase(t.locale);
    nav.innerHTML = '';
    course.modules.forEach((module, moduleIndex) => {
      const matches = module.lessons.map((lesson, lessonIndex) => ({ lesson, lessonIndex })).filter(({ lesson, lessonIndex }) => {
        const index = flatLessons.findIndex(item => item.moduleIndex === moduleIndex && item.lessonIndex === lessonIndex);
        const haystack = `${module.title} ${lesson.title} ${lesson.intro}`.toLocaleLowerCase(t.locale);
        const matchesLevel = selectedLevel === 'all' || flatLessons[index].levelKey === selectedLevel;
        return matchesLevel && (!term || haystack.includes(term));
      });
      if (!matches.length) return;
      const group = document.createElement('section');
      group.className = 'module-group';
      group.innerHTML = `<div class="module-title">${escapeHTML(module.number)} · ${escapeHTML(module.title)}</div>`;
      matches.forEach(({ lesson, lessonIndex }) => {
        const index = flatLessons.findIndex(item => item.moduleIndex === moduleIndex && item.lessonIndex === lessonIndex);
        const button = document.createElement('button');
        button.type = 'button';
        button.className = `lesson-link${index === current ? ' active' : ''}`;
        button.dataset.index = index;
        button.innerHTML = `<span class="lesson-num">${lessonIndex + 1}</span><span>${escapeHTML(lesson.title)}</span><span class="lesson-check">${completed.has(lessonId(index)) ? '✓' : ''}</span>`;
        button.addEventListener('click', () => goTo(index));
        group.appendChild(button);
      });
      nav.appendChild(group);
    });
    if (!nav.children.length) nav.innerHTML = `<p style="padding:16px;color:var(--muted);font-size:.85rem">${escapeHTML(t.noLessons)}</p>`;
  }

  function excelScene(item) {
    const topic = `${item.module.title} ${item.title}`.toLocaleLowerCase(t.locale);
    if (/gráfico|gráfic|graphique|chart|painel|panel|tableau de bord|dashboard/.test(topic)) {
      return `<div class="scene chart-scene"><div class="kpi-row"><span><b>4 820</b>${escapeHTML(t.scene.sales)}</span><span><b>68</b>${escapeHTML(t.scene.orders)}</span><span><b>+12%</b>${escapeHTML(t.scene.growth)}</span></div><div class="mini-chart" aria-label="${escapeHTML(t.scene.chartAria)}"><i style="height:42%"></i><i style="height:66%"></i><i style="height:53%"></i><i style="height:88%"></i><i style="height:74%"></i></div></div>`;
    }
    if (/fórmula|formula|formule|funç|función|fonction|function|soma|suma|somme|sum\b|se\b|si\b|if\b|procv|procv|vlookup|procx|buscarx|recherchex|xlookup|filtrar|filtrer|filter|ordenar|trier|sort|único|unique|nome|nombre|nom|name|referência|referencia|référence|reference/.test(topic)) {
      return `<div class="scene"><div class="formula-bar"><b>fx</b><span>${escapeHTML(t.scene.formula)}</span></div>${sheetHTML(true)}</div>`;
    }
    if (/tabela dinâmica|tabla dinámica|tableau croisé|pivot table|subtotal|cenário|escenario|scénario|scenario|solver|análise|análisis|analyse|analysis/.test(topic)) {
      return `<div class="scene pivot-scene"><div class="pivot-grid"><b>${escapeHTML(t.scene.category)}</b><b>${escapeHTML(t.scene.total)}</b><span>${escapeHTML(t.scene.stationery)}</span><span>1 240</span><span>${escapeHTML(t.scene.archive)}</span><span>980</span><strong>${escapeHTML(t.scene.grandTotal)}</strong><strong>2 220</strong></div><div class="field-list"><b>${escapeHTML(t.scene.fields)}</b><span>☑ ${escapeHTML(t.scene.product)}</span><span>☑ ${escapeHTML(t.scene.sales)}</span><span>☐ ${escapeHTML(t.scene.region)}</span></div></div>`;
    }
    if (/power query|importar|importer|import|csv|limpar|limpiar|nettoyer|clean|duplicados|duplicados|doublons|duplicates|validação|validación|validation|ordenar|ordenar|trier|sort|filtro|filtre|filter|texto|texte|text|datas|fechas|dates/.test(topic)) {
      return `<div class="scene data-scene"><div class="query-steps"><b>${escapeHTML(t.scene.appliedSteps)}</b><span>✓ ${escapeHTML(t.scene.source)}</span><span>✓ ${escapeHTML(t.scene.headers)}</span><span class="active">${escapeHTML(t.scene.changedTypes)}</span></div>${sheetHTML(false)}</div>`;
    }
    return `<div class="scene">${sheetHTML(false)}</div>`;
  }

  function sheetHTML(formulaMode) {
    const columns = ['A', 'B', 'C', 'D', 'E', 'F'];
    const rows = [1, 2, 3, 4, 5, 7, 9, 10, 11, 20];
    const values = {
      A1: t.scene.product, B1: t.scene.price, C1: t.scene.quantity, D1: t.scene.total, E1: t.scene.status,
      A2: t.scene.notebook, B2: '3,50', C2: '4', D2: formulaMode ? '=B2*C2' : '14,00', E2: t.scene.paid,
      A3: t.scene.pen, B3: '1,20', C3: '10', D3: '12,00', E3: t.scene.paid,
      A4: t.scene.folder, B4: '4,90', C4: '3', D4: '14,70', E4: t.scene.pending
    };
    const headers = `<div class="cell head"></div>${columns.map(column => `<div class="cell head" data-column="${column}">${column}</div>`).join('')}`;
    const cells = rows.map(row => `<div class="cell head" data-row="${row}">${row}</div>${columns.map(column => {
      const reference = `${column}${row}`;
      return `<div class="cell" data-cell="${reference}">${escapeHTML(values[reference] || '')}</div>`;
    }).join('')}`).join('');
    return `<div class="sheet-shell"><div class="cell-readout"><span>${escapeHTML(t.selectedCell)}</span><strong id="sceneCellRef">—</strong></div><div class="sheet-viewport"><div class="sheet">${headers}${cells}</div></div></div>`;
  }

  function wordScene(item) {
    const topic = `${item.module.title} ${item.title}`.toLocaleLowerCase(t.locale);
    if (/índice|index|table des matières|contents|citaç|cita|citation|bibliografia|bibliografía|bibliographie|bibliography|referência|referencia|référence|reference|legenda|leyenda|légende|caption|figuras|figures/.test(topic)) {
      return `<div class="word-page toc-page"><h3>${escapeHTML(t.scene.annualReport)}</h3><h4>${escapeHTML(t.scene.contents)}</h4><p>1. ${escapeHTML(t.scene.introduction)} <span>2</span></p><p>2. ${escapeHTML(t.scene.results)} <span>4</span></p><p>3. ${escapeHTML(t.scene.conclusions)} <span>8</span></p><small>${escapeHTML(t.scene.fieldsUpdated)}</small></div>`;
    }
    if (/tabela|tabla|table|imagem|imagen|image|smartart|caixa de texto|cuadro de texto|zone de texte|text box|formas|formes|shapes|boletim|boletín|bulletin|newsletter/.test(topic)) {
      return `<div class="word-page visual-page"><h3>${escapeHTML(t.scene.teamNewsletter)}</h3><div class="doc-columns"><div><div class="image-placeholder">${escapeHTML(t.scene.image)}</div><small>${escapeHTML(t.scene.figureCaption)}</small></div><div><h4>${escapeHTML(t.scene.results)}</h4><p>${escapeHTML(t.scene.shortInfo)}</p><div class="doc-table"><b>${escapeHTML(t.scene.month)}</b><b>${escapeHTML(t.scene.total)}</b><span>${escapeHTML(t.scene.september)}</span><span>82</span></div></div></div></div>`;
    }
    if (/comentário|comentario|commentaire|comment|alterações|cambios|modifications|changes|revisão|revisión|révision|review|editor|éditeur|acessibilidade|accesibilidad|accessibilité|accessibility/.test(topic)) {
      return `<div class="word-page review-page"><h3>${escapeHTML(t.scene.monthlyReport)}</h3><p>${escapeHTML(t.scene.reviewBefore)} <mark>${escapeHTML(t.scene.trackedChange)}</mark> ${escapeHTML(t.scene.reviewAfter)}</p><p>${escapeHTML(t.scene.clearDocument)}</p><aside class="comment-bubble"><b>${escapeHTML(t.scene.comment)}</b><span>${escapeHTML(t.scene.confirmValue)}</span></aside></div>`;
    }
    if (/orientaç|orientación|orientation|secç|sección|section|coluna|columna|colonne|column|folheto|folleto|brochure|capa|portada|couverture|cover|cabeçalho|encabezado|en-tête|header|rodapé|pie de página|pied de page|footer|página|page/.test(topic)) {
      return `<div class="word-page layout-page"><header>${escapeHTML(t.scene.companyReport)}</header><h3>${escapeHTML(t.scene.featuredProject)}</h3><div class="doc-columns"><p>${escapeHTML(t.scene.firstColumn)}</p><p>${escapeHTML(t.scene.secondColumn)}</p></div><footer>${escapeHTML(t.scene.page)} 1</footer></div>`;
    }
    if (/formulário|formulario|formulaire|form|controlo|control|contrôle|modelo|plantilla|modèle|template|proteger|protéger|protect/.test(topic)) {
      return `<div class="word-page form-page"><h3>${escapeHTML(t.scene.materialRequest)}</h3><label>${escapeHTML(t.scene.name)} <span>${escapeHTML(t.scene.writeHere)}</span></label><label>${escapeHTML(t.scene.department)} <span>${escapeHTML(t.scene.chooseOption)} ▾</span></label><label>${escapeHTML(t.scene.date)} <span>02/10/2026</span></label><p>☐ ${escapeHTML(t.scene.confirmData)}</p></div>`;
    }
    return `<div class="word-page"><h3>${escapeHTML(t.scene.monthlyReport)}</h3><p><strong>${escapeHTML(t.scene.objective)}</strong> ${escapeHTML(t.scene.documentGoal)}</p><p>${escapeHTML(t.scene.documentAdvice)}</p></div>`;
  }

  function actionLabel(step, index) {
    const strong = step.match(/<strong>(.*?)<\/strong>/i);
    if (strong) return stripToText(strong[1]).slice(0, 28);
    const code = step.match(/<code>(.*?)<\/code>/i);
    if (code) return stripToText(code[1]).slice(0, 28);
    const keys = [...step.matchAll(/<kbd>(.*?)<\/kbd>/gi)].map(match => stripToText(match[1]));
    if (keys.length) return keys.join(' + ').slice(0, 28);
    const text = stripToText(step);
    const rules = course.slug === 'excel'
      ? [
          [/guardar|ficheiro|livro em branco|abra o excel/i, t.actions.file],
          [/gráfico|tabela dinâmica|segmentação|minigráfico/i, t.actions.insert],
          [/validação|ordenar|filtro|remover duplicados/i, t.actions.data],
          [/imprimir|orientação|margens|área de impressão/i, t.actions.pageLayout],
          [/proteger|rever/i, t.actions.review],
          [/fórmula|soma|média|mínimo|máximo|procv|procx/i, t.actions.formulas],
          [/célula|linha|coluna|intervalo|grelha/i, t.actions.grid],
          [/formata|negrito|cor|limite|tipo de letra/i, t.actions.home]
        ]
      : [
          [/guardar|ficheiro|documento em branco|abra o word|exportar|pdf/i, t.actions.file],
          [/imagem|tabela|cabeçalho|rodapé|número de página/i, t.actions.insert],
          [/margem|orientação|quebra|coluna|esquema/i, t.actions.layout],
          [/tema|cores|tipos de letra/i, t.actions.design],
          [/índice|citação|bibliografia|legenda|referência cruzada/i, t.actions.references],
          [/impressão em série|destinatário|correspondência/i, t.actions.mailings],
          [/comentário|alterações|editor|acessibilidade|idioma/i, t.actions.review],
          [/painel de navegação|zoom|ver/i, t.actions.view],
          [/texto|parágrafo|negrito|lista|selecion/i, t.actions.home]
        ];
    const match = rules.find(([pattern]) => pattern.test(text));
    return match ? match[1] : `${t.action} ${index + 1}`;
  }

  function commandPath(step, index) {
    const strong = step.match(/<strong>(.*?)<\/strong>/i);
    if (strong) {
      const candidate = stripToText(strong[1]);
      if (!/exerc[ií]cio aut[oó]nomo|exercice autonome|ejercicio aut[oó]nomo|independent exercise/i.test(candidate)) return candidate;
    }
    const code = step.match(/<code>(.*?)<\/code>/i);
    if (code) return stripToText(code[1]);
    const keys = [...step.matchAll(/<kbd>(.*?)<\/kbd>/gi)].map(match => stripToText(match[1]));
    if (keys.length) return keys.join(' + ');
    return format(t.workspaceArea, { course: course.name }) || actionLabel(step, index);
  }

  function expectedResult(item, index) {
    const template = index === item.steps.length - 1 ? t.finalResultTemplate : t.expectedResultTemplate;
    return format(template, { title: item.title, course: course.name, current: index + 1, total: item.steps.length });
  }

  function stepDetails(item, index) {
    const safeIndex = Math.max(0, Math.min(index, item.steps.length - 1));
    return {
      where: commandPath(item.steps[safeIndex], safeIndex),
      action: stripToText(item.steps[safeIndex]),
      result: expectedResult(item, safeIndex)
    };
  }

  function detailedStepHTML(item, value, index) {
    const details = stepDetails(item, index);
    return `<article class="step beginner-step"><span class="step-number">${index + 1}</span><div class="step-content"><p class="step-main">${value}</p><div class="step-guidance"><span><b>${escapeHTML(t.whereToClick)}</b>${escapeHTML(details.where)}</span><span><b>${escapeHTML(t.whatToDo)}</b>${escapeHTML(details.action)}</span><span><b>${escapeHTML(t.expectedResult)}</b>${escapeHTML(details.result)}</span></div></div></article>`;
  }

  function ribbonHTML() {
    const tabs = course.slug === 'excel'
      ? [t.actions.file, t.actions.home, t.actions.insert, t.actions.pageLayout, t.actions.formulas, t.actions.data, t.actions.review]

    return tabs.map((label, index) => `<span data-ribbon="${escapeHTML(label)}"${index === 1 ? ' class="default-tab"' : ''}>${escapeHTML(label)}</span>`).join('');

    const topbar = document.querySelector('.topbar');

      <div class="course-switch" aria-label="${escapeHTML(t.switchCourse)}">
        ${course.slug === 'excel' ? '<strong aria-current="page">X</strong>' : `<a href="${escapeHTML(otherCourseLink.getAttribute('href'))}" title="${escapeHTML(t.openExcel)}">X</a>`}
        ${course.slug === 'word' ? '<strong aria-current="page">W</strong>' : `<a href="${escapeHTML(otherCourseLink.getAttribute('href'))}" title="${escapeHTML(t.openWord)}">W</a>`}

  function extractRawShortcuts(item) {
    if (Array.isArray(item.shortcuts) && item.shortcuts.length) return item.shortcuts;
    const shortcuts = [];
    [...item.steps, item.tip || ''].forEach(value => {
      const htmlCombos = [...value.matchAll(/<kbd>.*?<\/kbd>(?:\s*\+\s*<kbd>.*?<\/kbd>)*/gi)]
        .map(match => match[0].replace(/<\/?kbd>/gi, '').replace(/\s*\+\s*/g, ' + ').trim());
      const plain = stripToText(value);
      const plainCombos = plain.match(/(?:Ctrl|Alt|Shift|F\d{1,2}|Tab)(?:\s*\+\s*(?:Ctrl|Alt|Shift|F\d{1,2}|Tab|Enter|Seta|[A-Z0-9=]))+/gi) || [];
      shortcuts.push(...htmlCombos, ...plainCombos.map(combo => combo.replace(/\s*\+\s*/g, ' + ')));
    });
    return [...new Set(shortcuts)].slice(0, 8);
  }

  function localiseKey(key) {
    const normal = key.trim().toLocaleLowerCase(t.locale);
    if (/^(ctrl|control|controlo)$/.test(normal)) return t.keyboardKeys.ctrl;
    if (/^(shift|maj|may[uú]s)$/.test(normal)) return t.keyboardKeys.shift;
    if (normal === 'alt') return t.keyboardKeys.alt;
    if (/^(enter|entr[eé]e|intro)$/.test(normal)) return t.keyboardKeys.enter;
    if (/^(tab|tabulation|tabulador)$/.test(normal)) return t.keyboardKeys.tab;
    if (/^(seta|fl[eè]che|flecha|arrow)$/.test(normal)) return t.keyboardKeys.arrow;
    if (/^(espa[cç]o|espace|espacio|space|barra de espa[cç]o)$/.test(normal)) return t.keyboardKeys.space;
    if (/^(esc|[eé]chap)$/.test(normal)) return t.keyboardKeys.escape;
    return key.trim();
  }

  function keyboardHTML(item) {
    const shortcuts = extractRawShortcuts(item);
    if (!shortcuts.length) return '';
    const combos = shortcuts.map((shortcut, comboIndex) => {
      const keys = shortcut.split(/\s*\+\s*/).map(key => `<kbd style="--key-order:${comboIndex}">${escapeHTML(localiseKey(key))}</kbd>`).join('<i>+</i>');
      return `<span class="keyboard-combo">${keys}</span>`;
    }).join('');
    return `<aside class="keyboard-coach"><div class="keyboard-heading"><span aria-hidden="true">⌨</span><p><strong>${escapeHTML(t.keyboardShortcuts)}</strong><small>${escapeHTML(t.keyboardHelp)}</small></p></div><div class="keyboard-combos">${combos}</div></aside>`;
  }

    const actions = item.steps.map((step, index) => `<button type="button" class="guide-target" data-guide="${index}" data-click-label="${escapeHTML(t.clickHere)}"><span>${index + 1}</span>${escapeHTML(actionLabel(step, index))}</button>`).join('');
    const dots = item.steps.map((_, index) => `<button type="button" class="guide-dot" data-dot="${index}" aria-label="${escapeHTML(format(t.stepLabel, { current: index + 1, total: item.steps.length }))}"></button>`).join('');

    const flow = `<div class="animation-flow" aria-hidden="true"><span><i>1</i>${escapeHTML(t.locateControl)}</span><span><i>2</i>${escapeHTML(t.performClick)}</span><span><i>3</i>${escapeHTML(t.verifyChange)}</span></div>`;
    const reproduce = `<div class="reproduce-bar"><span aria-hidden="true">🖥</span><p><strong>${escapeHTML(t.reproduceNow)}</strong><small>${escapeHTML(format(t.reproduceHelp, { course: course.name }))}</small></p><button id="coachDone" type="button">✓ ${escapeHTML(t.markStepDone)}</button></div>`;
    const coach = `${flow}<div class="guide-progress" aria-label="${escapeHTML(t.stepByStep)}">${dots}</div><div class="instruction-panel" aria-live="polite"><div><span>1</span><p><b>${escapeHTML(t.whereToClick)}</b><strong id="guideWhere">${escapeHTML(first.where)}</strong></p></div><div><span>2</span><p><b>${escapeHTML(t.whatToDo)}</b><strong id="guideDo">${escapeHTML(first.action)}</strong></p></div><div><span>3</span><p><b>${escapeHTML(t.expectedResult)}</b><strong id="guideResult">${escapeHTML(first.result)}</strong></p></div></div>${reproduce}<div class="click-coach"><span class="coach-count" id="coachCount">1/${item.steps.length}</span><p><strong id="coachStatus">${escapeHTML(t.demoPaused)}</strong><span id="coachText">${escapeHTML(first.action)}</span></p><button id="coachNext" type="button">${escapeHTML(t.showNextPoint)}</button></div>`;
    const cursor = `<div class="demo-cursor" id="demoCursor" aria-hidden="true"><i>↖</i><b>${escapeHTML(t.clickHere)}</b></div><div class="result-stamp" aria-hidden="true">✓ ${escapeHTML(t.verifyChange)}</div>`;
    const keyboard = keyboardHTML(item);
    if (course.slug === 'excel') {
      return `<div class="guided-block" id="guidedBlock"><div class="guide-heading"><div><strong>${escapeHTML(t.visualGuide)}</strong><span>${escapeHTML(t.visualGuideHelp)}</span></div><span class="live-badge">${escapeHTML(t.stepByStep)}</span></div>${controls}${keyboard}<div class="office-preview" id="officePreview" data-demo-zone="ribbon" aria-label="${escapeHTML(t.excelSimulation)}"><div class="preview-titlebar">${escapeHTML(t.excelWorkbookTitle)}</div><div class="preview-ribbon">${ribbonHTML()}</div><div class="guided-actions">${actions}</div>${excelScene(item)}${cursor}</div>${coach}</div>`;
    }
    return `<div class="guided-block" id="guidedBlock"><div class="guide-heading"><div><strong>${escapeHTML(t.visualGuide)}</strong><span>${escapeHTML(t.visualGuideHelp)}</span></div><span class="live-badge">${escapeHTML(t.stepByStep)}</span></div>${controls}${keyboard}<div class="office-preview" id="officePreview" data-demo-zone="ribbon" aria-label="${escapeHTML(t.wordSimulation)}"><div class="preview-titlebar">${escapeHTML(t.wordDocumentTitle)}</div><div class="preview-ribbon">${ribbonHTML()}</div><div class="guided-actions">${actions}</div><div class="word-page-wrap">${wordScene(item)}</div>${cursor}</div>${coach}</div>`;
  }

  function stripTags(value = '') {
    const node = document.createElement('div');
    node.innerHTML = value;
    return escapeHTML(node.textContent || '');
  }

  function imageHTML(image) {
    if (!image) return '';
    return `<figure class="real-shot"><div class="shot-header"><strong>${format(t.realScreenshot, { course: escapeHTML(course.name) })}</strong><span>${escapeHTML(t.referenceInterface)}</span></div><button class="zoom-image" type="button" data-src="${escapeHTML(image.file)}" data-caption="${escapeHTML(image.caption)}" aria-label="${escapeHTML(t.enlargeImage)}"><img src="${escapeHTML(image.file)}" alt="${escapeHTML(image.alt)}"></button><figcaption>${escapeHTML(image.caption)} · <a href="${escapeHTML(image.source)}" target="_blank" rel="noreferrer">${escapeHTML(t.microsoftSource)}</a></figcaption></figure>`;
