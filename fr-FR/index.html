<!doctype html>
<html lang="fr-FR" data-theme="excel">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Cours interactif complet de Microsoft Excel, de l’initiation aux projets professionnels, en français.">
  <meta name="theme-color" content="#107c41">
  <title>Apprendre Excel — Cours interactif complet</title>
  <script>try{document.documentElement.dataset.colorScheme=localStorage.getItem('office-academy-color-scheme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch{document.documentElement.dataset.colorScheme='light'}</script>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23107c41'/%3E%3Cpath fill='white' d='M15 14h24v8h10v28H15V14zm9 9 5 9-5 9h7l3-6 3 6h7l-6-9 6-9h-7l-3 6-3-6h-7z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Contenu du cours">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">X</div>
        <div><strong>Apprendre Excel</strong><span>Français</span></div>
      </div>
      <div class="progress-card">
        <div class="progress-copy"><span>Votre progression</span><strong id="progressText">0%</strong></div>
        <div class="progress-track"><span id="progressBar"></span></div>
        <small id="progressCount">0 sur 45 leçons</small>
      </div>
      <label class="search-box">
        <span aria-hidden="true">⌕</span>
        <input id="lessonSearch" type="search" placeholder="Rechercher une leçon" autocomplete="off">
      </label>
      <div class="level-filter" id="levelFilter" aria-label="Filtrer les leçons par niveau"></div>
      <nav id="courseNav" class="course-nav"></nav>
      <div class="sidebar-footer">
        <button id="resetProgress" class="ghost-button" type="button">Réinitialiser la progression</button>
        <a href="https://apprendre-word-multilingue.vercel.app">Ouvrir le cours Word</a>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="menuButton" class="icon-button menu-button" type="button" aria-label="Ouvrir le menu" aria-expanded="false">☰</button>
        <div class="crumb" id="crumb">Module 1</div>
        <div class="top-actions">
          <span class="offline-pill">Disponible hors connexion</span>
          <button id="themeButton" class="icon-button" type="button" aria-label="Activer le mode sombre" title="Activer le mode sombre">☾</button>
          <button id="focusButton" class="icon-button" type="button" aria-label="Mode concentration" title="Mode concentration">◐</button>
        </div>
      </header>

      <article id="lesson" class="lesson" tabindex="-1"></article>

      <footer class="lesson-footer">
        <button id="prevButton" class="nav-button secondary" type="button">Précédent</button>
        <div class="lesson-position" id="lessonPosition">1 / 45</div>
        <button id="nextButton" class="nav-button primary" type="button">Suivant</button>
      </footer>
    </main>
  </div>

  <div class="scrim" id="scrim"></div>
  <dialog id="imageDialog" class="image-dialog">
    <button id="closeImage" class="dialog-close" type="button" aria-label="Fermer">×</button>
    <img id="dialogImage" alt="">
    <p id="dialogCaption"></p>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="ui.js"></script>
  <script src="course-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
